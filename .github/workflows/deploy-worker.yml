name: Deploy Worker to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'src/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'vite.config.ts'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Production Cloudflare build variables — do not hardcode in source
          VITE_ANILIST_CLIENT_ID: '50024'
          VITE_MAL_CLIENT_ID: 'ce55a1d587f549b33c1fa36ec10fe8d2'
          VITE_VIDEO_API_URL: ''
          VITE_AUTH_API_URL: 'https://graceful-dream-569.fly.dev'
          AERI_BASE: '/'
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.129.0"
          # Unambiguous: env.production is pinned to Worker 'aeri' (see wrangler.jsonc). Do not use 'aeri-production'.
          command: deploy --env production
