<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon - %BASE_URL% ensures correct /aeri/ prefix on GH Pages and dev -->
    <link rel="icon" type="image/x-icon" href="%BASE_URL%favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon.png" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="shortcut icon" href="%BASE_URL%favicon.ico" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <!-- `viewport-fit=cover` lets the page reach the screen edges; the status
         strip itself is painted by `[data-nav-status-strip]` (App) because the
         app opts into `black-translucent` (D173). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <!-- iOS Home Screen app. `black-translucent` is the ONLY status-bar mode
         where the page itself owns the strip: iOS stops drawing its translucent
         "Liquid Glass" bar (which on iOS 26 shows a blurred slice of the page
         content above the navbar) and the app paints that strip with its own
         opaque `--bg` instead. `default` keeps the blur, `black` forces black.
         The boot script below picks `default` on light themes, where
         black-translucent's white clock/battery would be unreadable. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Aeri" />
    <script>
      // Runs during head parse, before the app bundle. Keeps the iOS status
      // bar / splash on the user's theme instead of the boot-time black.
      try {
        var __aeriBg = localStorage.getItem('aeri:theme-bg')
        if (__aeriBg) {
          var __aeriMeta = document.querySelector('meta[name="theme-color"]')
          if (__aeriMeta) __aeriMeta.setAttribute('content', __aeriBg)
          document.documentElement.style.backgroundColor = __aeriBg
          // Status bar text is white under black-translucent, so switch back
          // to the system bar on light themes.
          var __aeriHex = /^#([0-9a-f]{6})$/i.exec(__aeriBg)
          if (__aeriHex) {
            var __aeriN = parseInt(__aeriHex[1], 16)
            var __aeriLum = (0.2126 * ((__aeriN >> 16) & 255) + 0.7152 * ((__aeriN >> 8) & 255) + 0.0722 * (__aeriN & 255)) / 255
            var __aeriBar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')
            if (__aeriBar && __aeriLum > 0.5) __aeriBar.setAttribute('content', 'default')
          }
        }
      } catch (e) {}
    </script>
    <meta name="description" content="Aeri - minimal anime discovery, tracking, and watching. Cinematic browsing, quiet UI." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Cal Sans: block to avoid FOUT flash, preload for early fetch -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cal+Sans&display=block" />
    <link href="https://fonts.googleapis.com/css2?family=Cal+Sans&display=block" rel="stylesheet" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <title>Aeri</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
