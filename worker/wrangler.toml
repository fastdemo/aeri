name = "aeri-video"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
UPSTREAM_ALLANIME = "https://api.allanime.day"
# Optional: set to a ScraperAPI or FlareSolverr URL if providers need bypass
# SCRAPER_API_KEY = ""

[env.production.vars]
ALLOWED_ORIGIN = "https://fastdemo.github.io"

# For preview
[env.preview.vars]
ALLOWED_ORIGIN = "*"
